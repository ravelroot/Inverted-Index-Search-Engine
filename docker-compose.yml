services:
  sonda:
    build: .
    image: sonda:local
    container_name: sonda
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SONDA_PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      Sonda__Api__ApiKey: ${SONDA_API_KEY:-}
      Sonda__Analysis__Language: ${SONDA_IDIOMA:-auto}
      Sonda__Indexing__RamBufferMb: ${SONDA_RAM_MB:-128}
      Sonda__Sources__0__Name: documentos
      Sonda__Sources__0__Path: /documentos
      Sonda__Sources__0__Watch: "true"
    volumes:
      - sonda-dados:/dados
      - ${SONDA_DOCUMENTOS:-./samples/corpus}:/documentos:ro

volumes:
  sonda-dados:
